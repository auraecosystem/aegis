[workspace]
resolver = "2"

members = [
    "crates/aegis-kernel",
    "crates/aegis-cli",
    "crates/aegis-common",
    "crates/aegis-config",
    "crates/aegis-policy",
    "crates/aegis-plugin",
    "crates/aegis-events",
    "crates/aegis-crypto",
    "crates/aegis-integrity",
    "crates/aegis-filesystem",
    "crates/aegis-secrets",
    "crates/aegis-dependencies",
    "crates/aegis-git",
    "crates/aegis-audit",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Aegis Developers"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

clap = { version = "4", features = ["derive"] }

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = "0.3"

sha2 = "0.10"
blake3 = "1"

walkdir = "2"
ignore = "0.4"

uuid = { version = "1", features = ["v4"] }

chrono = { version = "0.4", features = ["serde"] }
